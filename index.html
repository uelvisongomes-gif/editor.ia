<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRIE Studios — Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
      :root {
        --crie-bg: #08040E;
        --crie-panel: #12081C;
        --crie-elevated: #1A0F28;
        --crie-hover: #241535;
        --crie-stroke: #2A1A3E;
        --crie-stroke-soft: #1F1030;
        --crie-text: #F5EFFF;
        --crie-text-muted: #A090B8;
        --crie-text-dim: #7060A0;
        --crie-orange: #FF6A2B;
        --crie-pink: #FF3EA5;
        --crie-purple: #8B5CF6;
        --crie-gradient: linear-gradient(92deg, #FF6A2B 0%, #FF3EA5 100%);
        --crie-glow: 0 0 24px rgba(255, 92, 130, 0.35);
      }
      html, body {
        background:
          radial-gradient(ellipse 1200px 700px at 20% -10%, rgba(255, 62, 165, 0.10), transparent 60%),
          radial-gradient(ellipse 900px 600px at 100% 100%, rgba(255, 106, 43, 0.08), transparent 60%),
          var(--crie-bg);
        color: var(--crie-text);
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      h1, h2, h3, .crie-display {
        font-family: 'Inter Tight', 'Inter', system-ui, sans-serif;
        letter-spacing: -0.005em;
      }
      /* Aplica gradient CRIE aonde tiver o laranja original em botoes CTA */
      .crie-cta {
        background: var(--crie-gradient) !important;
        box-shadow: var(--crie-glow) !important;
      }
      .crie-logo {
        background: var(--crie-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-family: 'Inter Tight', sans-serif;
        font-weight: 900;
      }
      /* Glow em elementos ativos */
      .crie-active-glow { box-shadow: var(--crie-glow); }

      /* Style Engine · keyframes por animação — cada estilo usa uma keyframe diferente */
      @keyframes fxPop {
        0%   { opacity: 0; transform: scale(0.4) translateY(20px); }
        60%  { opacity: 1; transform: scale(1.15) translateY(-4px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes fxBigNumber {
        0%   { opacity: 0; transform: scale(0.2); filter: blur(20px); }
        50%  { opacity: 1; transform: scale(1.2); filter: blur(0); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fxSlide {
        0%   { opacity: 0; transform: translateX(-80px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes fxSlideRight {
        0%   { opacity: 0; transform: translateX(60px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes fxTypewriter {
        0%   { opacity: 0; width: 0; letter-spacing: -0.5em; }
        50%  { opacity: 1; }
        100% { opacity: 1; width: auto; letter-spacing: 0; }
      }
      @keyframes fxFadeUp {
        0%   { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fxBounce {
        0%   { opacity: 0; transform: translateY(-40px) scale(0.5); }
        50%  { transform: translateY(6px) scale(1.1); }
        75%  { transform: translateY(-2px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fxScale {
        0%   { opacity: 0; transform: scale(0.6); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fxDrawLine {
        0%   { opacity: 0; width: 0; }
        30%  { opacity: 1; }
        100% { opacity: 1; width: 100%; }
      }
      @keyframes fxBadgePulse {
        0%   { opacity: 0; transform: scale(0.5) rotate(-8deg); }
        40%  { opacity: 1; transform: scale(1.3) rotate(4deg); }
        70%  { transform: scale(0.95) rotate(-2deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes fxCirclePulse {
        0%   { opacity: 0; transform: scale(2); box-shadow: 0 0 0 0 rgba(255,106,43,0.6); }
        70%  { opacity: 1; transform: scale(0.95); box-shadow: 0 0 0 20px rgba(255,106,43,0); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fxWhipLeft {
        0%   { transform: translateX(120%) skewX(-25deg); filter: blur(12px); opacity: 0; }
        100% { transform: translateX(0) skewX(0); filter: blur(0); opacity: 1; }
      }
      @keyframes fxFlash {
        0%   { background: rgba(255,255,255,0.9); }
        100% { background: transparent; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
